<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Cigar Concierge</title>
  <link rel="icon" href="https://cigar-concierge-seattle.netlify.app/assets/logo/crest-sm.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact">
  <section>
    <div class="container split">
      <div>
        <div class="kicker">The bell</div>
        <h2 style="font-family:var(--serif);font-size:3rem;margin:8px 0 16px;font-weight:500">Ring it on X.</h2>
        <p>Real orders are taken by @SeattleCigars. This form stores nothing — it builds the message you should paste into a DM.</p>
        <form class="form" data-contact onsubmit="return false">
          <label>Name</label>
          <input type="text" name="name" placeholder="Your name">
          <label>What do you want</label>
          <select name="want">
            <option>House blend bundle / box</option>
            <option>Vault allocation</option>
            <option>Private label / custom band</option>
            <option>Something rare you didn’t see listed</option>
          </select>
          <label>Notes</label>
          <textarea name="notes" rows="5" placeholder="Box of Blockbuster + bundle of The 250. Ship to…"></textarea>
          <button class="btn btn-gold" type="submit">Copy message &amp; open X</button>
        </form>
        <p class="card-meta" style="margin-top:16px">Direct: <a href="https://x.com/SeattleCigars" target="_blank">x.com/SeattleCigars</a></p>
      </div>
      <img src="https://cigar-concierge-seattle.netlify.app/assets/images/seattle-skyline.jpg" alt="Seattle evening skyline">
    </div>
  </section>
  <script src="js/catalog.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.querySelector("[data-contact]");
      form.addEventListener("submit", async () => {
        const fd = new FormData(form);
        const text = `Cigar Concierge request from ${fd.get("name") || "a client"}:\n${fd.get("want")}\n${fd.get("notes")}`;
        try { await navigator.clipboard.writeText(text); } catch {}
        window.open("https://x.com/messages/compose?recipient_id=1067975870868930560", "_blank");
      });
    });
  </script>
</body>
</html>
