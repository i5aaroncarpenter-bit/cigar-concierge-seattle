<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Journal — Cigar Concierge</title>
  <link rel="icon" href="https://cigar-concierge-seattle.netlify.app/assets/logo/crest-sm.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="journal">
  <section>
    <div class="container section-head">
      <div class="kicker">From the timeline</div>
      <h2>Cigar films</h2>
      <div class="gold-rule"></div>
      <p>Every cigar video isolated from @SeattleCigars — hosted here, and embedded from the original posts.</p>
    </div>
    <div class="container video-grid">
      <div data-video-featured></div>
      <div class="video-side" data-video-side></div>
    </div>
  </section>
  <section style="padding-top:10px">
    <div class="container">
      <div class="section-head">
        <div class="kicker">Original posts</div>
        <h2>Embedded from X</h2>
        <div class="gold-rule"></div>
      </div>
      <div class="embed-grid" data-embeds></div>
    </div>
  </section>
  <script src="js/catalog.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
